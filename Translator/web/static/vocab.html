<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Tutor – Vocabulary</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- Nav -->
    <nav class="page-nav">
      <a href="index.html">💬 Phrases</a>
      <a href="vocab.html" class="active">📖 Vocabulary</a>
    </nav>

    <!-- Header -->
    <header>
      <h1>📖 Vocabulary</h1>
      <div class="controls">
        <input id="name-input" class="name-input" type="text" placeholder="Your name (optional)" maxlength="40" />
        <select id="language">
          <option>Spanish</option>
          <option>French</option>
          <option>German</option>
          <option>Italian</option>
          <option>Japanese</option>
          <option>Mandarin</option>
          <option>Portuguese</option>
        </select>
        <select id="level">
          <option value="1">Level 1 – Beginner</option>
          <option value="2">Level 2 – Elementary</option>
          <option value="3">Level 3 – Intermediate</option>
          <option value="4">Level 4 – Upper-Intermediate</option>
          <option value="5">Level 5 – Advanced</option>
        </select>
        <button id="gen-all-btn" class="icon-btn" title="Generate all levels for this language">⚡ All Levels</button>
        <button id="refresh-btn" class="icon-btn" title="Regenerate vocabulary for this level">↺ New Words</button>
      </div>
    </header>

    <!-- Word card -->
    <section class="card">
      <div id="word-loading" class="loading">
        <div class="spinner"></div>
        <p>Loading vocabulary…</p>
      </div>

      <div id="word-content" class="hidden">
        <p id="word-text" class="vocab-word"></p>
        <p id="word-translation" class="vocab-translation"></p>
        <p id="word-pronunciation" class="vocab-pronunciation"></p>
        <div class="vocab-category"><span id="word-category"></span></div>

        <p id="word-example" class="vocab-example"></p>
      </div>
    </section>

    <!-- Record button -->
    <section class="record-section">
      <button id="record-btn" class="record-btn" disabled>
        <span class="btn-icon">🎤</span>
        <span class="btn-label">Record</span>
      </button>
      <p id="record-status" class="record-status"></p>
    </section>

    <!-- Results card -->
    <section id="results" class="card results-card hidden">
      <div class="result-header">
        <div class="score-block">
          <span id="score-number" class="score-number">0</span>
          <span class="score-denom">/10</span>
        </div>
        <div class="score-bar-wrap">
          <div id="score-bar" class="score-bar"></div>
        </div>
        <span id="accuracy-badge" class="badge">–</span>
      </div>

      <p class="result-label">You said</p>
      <p id="transcription" class="transcription"></p>

      <div class="vocab-feedback">
        <p id="pronunciation-feedback"></p>
        <p id="usage-tip"></p>
        <p id="encouragement" class="encouragement"></p>
      </div>

      <button id="next-btn" class="next-btn">Next Word →</button>
    </section>

    <!-- Error banner -->
    <div id="error-banner" class="error-banner hidden"></div>

    <!-- Word bank -->
    <section id="bank-section" class="card history-card hidden">
      <h2 class="history-title">Level <span id="bank-label">1</span> Words</h2>
      <ul id="bank-list" class="level-phrases-list"></ul>
    </section>

  </div>

  <script src="vocab.js"></script>
</body>
</html>
